<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- UGC Collector のアイコン: 割れた音符（TikTok のロゴではなく、オリジナルの八分音符に水色・赤のずらしを重ねたもの） -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#23232b"/>
      <stop offset="1" stop-color="#0a0a0d"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.45" r="0.6">
      <stop offset="0" stop-color="#2a2a36" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#0a0a0d" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="tile"><rect x="100" y="100" width="824" height="824" rx="185"/></clipPath>
    <!-- ひびで左右に分ける -->
    <clipPath id="left"><path d="M0 0 L742 0 L700 182 L642 330 L694 424 L566 522 L604 604 L438 760 L474 862 L362 1024 L0 1024 Z"/></clipPath>
    <clipPath id="right"><path d="M742 0 L1024 0 L1024 1024 L362 1024 L474 862 L438 760 L604 604 L566 522 L694 424 L642 330 L700 182 Z"/></clipPath>
    <g id="note">
      <circle cx="432" cy="694" r="124"/>
      <path d="M 514 700 L 514 262" stroke-width="88" stroke-linecap="round" fill="none"/>
      <path d="M 514 292 C 556 410, 676 418, 752 482" stroke-width="88" stroke-linecap="round" fill="none"/>
    </g>
    <g id="chroma">
      <use href="#note" fill="#25F4EE" stroke="#25F4EE" transform="translate(-18,-14)"/>
      <use href="#note" fill="#FE2C55" stroke="#FE2C55" transform="translate(18,14)"/>
      <use href="#note" fill="#ffffff" stroke="#ffffff"/>
    </g>
  </defs>

  <g clip-path="url(#tile)">
    <rect x="100" y="100" width="824" height="824" fill="url(#bg)"/>
    <rect x="100" y="100" width="824" height="824" fill="url(#glow)"/>
    <!-- 左のかけら（そのまま） -->
    <g clip-path="url(#left)"><use href="#chroma"/></g>
    <!-- 右のかけら（ずれて少し傾く） -->
    <g transform="translate(26,18) rotate(3 560 560)"><g clip-path="url(#right)"><use href="#chroma"/></g></g>
    <!-- ひびの光と、飛んだ小さなかけら -->
    <path d="M700 182 L642 330 L694 424 L566 522 L604 604 L438 760 L474 862" fill="none" stroke="#25F4EE"
          stroke-width="5" stroke-opacity="0.55" stroke-linejoin="round"/>
    <polygon points="742,300 776,286 764,326" fill="#ffffff" opacity="0.9"/>
    <polygon points="650,560 690,548 676,590" fill="#FE2C55" opacity="0.9"/>
    <polygon points="520,820 548,800 552,836" fill="#25F4EE" opacity="0.85"/>
    <polygon points="786,420 806,414 798,438" fill="#ffffff" opacity="0.7"/>
    <!-- うっすらとした縁 -->
    <rect x="100.5" y="100.5" width="823" height="823" rx="185" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="3"/>
  </g>
</svg>
